[versions]
agp = "8.13.1"
kotlin = "2.2.20"
coroutines = "1.9.0"
serialization = "1.7.3"
okhttp = "4.12.0"
webrtc = "1.3.10"
androidxCore = "1.13.1"
appcompat = "1.7.0"
activity = "1.9.3"
lifecycle = "2.8.7"
security = "1.1.0-alpha06"
work = "2.9.1"
zxing = "3.5.3"
firebaseBom = "33.7.0"
junit = "4.13.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Сборка libwebrtc от Stream: поддерживаемый преемник заброшенного org.webrtc:google-webrtc.
# Пакеты внутри остались org.webrtc — код переносим на любую другую сборку без правок.
stream-webrtc = { module = "io.getstream:stream-webrtc-android", version.ref = "webrtc" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# FCM — главный механизм подъёма убитого сервиса после разряда/сна (без google-services
# плагина: инициализируем Firebase вручную из BuildConfig, чтобы сборка не требовала
# google-services.json на этапе разработки).
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
